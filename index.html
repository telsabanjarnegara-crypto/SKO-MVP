<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123b5d">
<link rel="manifest" href="./manifest.json"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="icon" href="./icon-192.png" type="image/png">
<title>SKO MVP 1 Test — Sistem Keuangan Organisasi</title>
<style>
:root{--navy:#123b5d;--blue:#1976d2;--cyan:#0ea5a8;--green:#16834b;--orange:#d97706;--red:#c62828;--bg:#eef4f8;--card:#fff;--text:#1e293b;--muted:#64748b;--line:#dbe5ed;--shadow:0 8px 24px rgba(15,43,66,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}
header{background:linear-gradient(135deg,#123b5d,#17679a);color:#fff;padding:18px 22px;position:sticky;top:0;z-index:10;box-shadow:0 4px 14px #0b29421f}header h1{margin:0;font-size:24px}header p{margin:4px 0 0;color:#d9e8f3;font-size:14px}
nav{display:flex;gap:8px;overflow:auto;background:#fff;padding:10px 14px;position:sticky;top:78px;z-index:9;border-bottom:1px solid var(--line)}nav button{border:0;border-radius:12px;background:#edf2f7;color:#334155;padding:11px 16px;font-weight:700;white-space:nowrap;cursor:pointer}nav button.active{background:var(--blue);color:white}
main{max-width:1450px;margin:auto;padding:22px}.page{display:none}.page.active{display:block}.title-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.title-row h2{margin:0;font-size:25px}.muted{color:var(--muted)}
.grid{display:grid;gap:14px}.cards{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.card h3{margin:0 0 12px}.metric .label{font-size:13px;color:var(--muted)}.metric .value{font-size:24px;font-weight:800;margin-top:7px}.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}.orange{color:var(--orange)}
.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#e9f0f6;color:#23384c}.danger{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}.btn:disabled{opacity:.5;cursor:not-allowed}
form{display:grid;gap:12px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field label{font-size:13px;font-weight:800;color:#475569}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:11px 12px;font:inherit;background:white}.field textarea{min-height:85px;resize:vertical}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap}
.notice{padding:13px 15px;background:#eff8ff;border:1px solid #cfe5f8;border-radius:12px;margin-bottom:14px}.notice strong{color:#0b568f}
table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px}th{color:#526273;background:#f8fafc;position:sticky;top:0}.num{text-align:right;font-variant-numeric:tabular-nums}.nowrap{white-space:nowrap}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.badge.good{background:#dcfce7;color:#166534}.badge.warn{background:#fef3c7;color:#92400e}.badge.bad{background:#fee2e2;color:#991b1b}.badge.info{background:#dbeafe;color:#1e40af}.badge.neutral{background:#e2e8f0;color:#475569}
.bar{height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#1976d2,#0ea5a8);border-radius:999px}.small{font-size:12px}.section-title{font-size:17px;font-weight:850;margin:0 0 12px}.empty{padding:28px;text-align:center;color:var(--muted)}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
@media(max-width:600px){header{padding:14px 16px}header h1{font-size:20px}nav{top:67px}.cards,.form-grid{grid-template-columns:1fr}main{padding:14px}.title-row{align-items:flex-start;flex-direction:column}.card{padding:14px}}
@media print{header,nav,.no-print{display:none!important}body{background:white}main{padding:0}.card{box-shadow:none;border:0}}

.print-area{display:none}.print-only{display:none}.report-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.subtle{font-size:12px;color:var(--muted)}
@media print{
  @page{size:A4 portrait;margin:16mm 14mm 16mm 14mm}
  body{background:#fff!important;color:#111!important;font-family:Arial,Helvetica,sans-serif!important}
  header,nav,main>.page,#printArea>.no-print{display:none!important}
  #printArea{display:block!important;font-size:11pt;line-height:1.35}
  #printArea .print-head{text-align:center;margin-bottom:16px}
  #printArea .print-head h1{font-size:16pt;margin:0 0 3px}
  #printArea .print-head h2{font-size:13pt;margin:0 0 3px}
  #printArea .print-head p{margin:2px 0}
  #printArea .print-section{margin:0 0 22px;page-break-inside:avoid}
  #printArea .print-section h3{font-size:12pt;text-align:center;margin:0 0 8px;border-bottom:1px solid #222;padding-bottom:5px}
  #printArea table{width:100%;border-collapse:collapse;background:#fff}
  #printArea th,#printArea td{padding:5px 6px;border-bottom:1px solid #aaa;font-size:10pt;text-align:left;background:#fff;position:static}
  #printArea th.num,#printArea td.num{text-align:right}
  #printArea .total td,#printArea .total th{font-weight:700;border-top:1px solid #222}
  #printArea .grand td,#printArea .grand th{font-weight:800;border-top:2px solid #111;border-bottom:2px solid #111}
  #printArea .signature{margin-top:35px;display:flex;justify-content:flex-end}
  #printArea .signature-box{width:240px;text-align:center}
  #printArea .footer{margin-top:24px;font-size:9pt;color:#444}
}
</style>
</head>
<body>
<header><h1>SKO MVP 1.1 TEST</h1><p>Sistem Keuangan Organisasi • Nirlaba • Tablet • Free • Offline • Edit • Cetak • PDF</p></header>
<nav id="nav"></nav>
<main>
<div id="printArea" class="print-area"></div>
<section id="dashboard" class="page active"></section>
<section id="transaksi" class="page"></section>
<section id="laporan" class="page"></section>
<section id="kegiatan" class="page"></section>
<section id="cetak" class="page"></section>
<section id="pengaturan" class="page"></section>
</main>
<script>
const KEY='SKO_MVP1_TEST_DB';
const months=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const defaultAccounts=[
{id:'101',code:'101',name:'Kas',group:'Aset',sub:'Kas & Bank',cash:true},
{id:'102',code:'102',name:'Bank BRI',group:'Aset',sub:'Kas & Bank',cash:true},
{id:'103',code:'103',name:'Bank Jateng',group:'Aset',sub:'Kas & Bank',cash:true},
{id:'111',code:'111',name:'Piutang Donasi',group:'Aset',sub:'Piutang'},
{id:'121',code:'121',name:'Peralatan',group:'Aset',sub:'Aset Tetap'},
{id:'201',code:'201',name:'Hutang',group:'Liabilitas',sub:'Kewajiban'},
{id:'301',code:'301',name:'Aset Neto Tanpa Pembatasan',group:'Aset Neto',sub:'Aset Neto'},
{id:'302',code:'302',name:'Aset Neto Dengan Pembatasan',group:'Aset Neto',sub:'Aset Neto'},
{id:'401',code:'401',name:'Donasi',group:'Penerimaan',sub:'Sumber Daya'},
{id:'402',code:'402',name:'Hibah',group:'Penerimaan',sub:'Sumber Daya'},
{id:'403',code:'403',name:'Iuran',group:'Penerimaan',sub:'Sumber Daya'},
{id:'404',code:'404',name:'Penerimaan Kegiatan',group:'Penerimaan',sub:'Sumber Daya'},
{id:'405',code:'405',name:'Penerimaan Lainnya',group:'Penerimaan',sub:'Sumber Daya'},
{id:'501',code:'501',name:'Beban Program',group:'Beban',sub:'Kegiatan'},
{id:'502',code:'502',name:'Beban Operasional',group:'Beban',sub:'Operasional'},
{id:'503',code:'503',name:'Beban Administrasi',group:'Beban',sub:'Administrasi'},
{id:'504',code:'504',name:'Beban SDM',group:'Beban',sub:'SDM'},
{id:'505',code:'505',name:'Beban Lainnya',group:'Beban',sub:'Lainnya'}];
function fresh(){return {org:'Organisasi Saya',period:new Date().toISOString().slice(0,10),accounts:structuredClone(defaultAccounts),activities:[{id:'ACT1',name:'Program Pendidikan'},{id:'ACT2',name:'Program Sosial'},{id:'ACT3',name:'Operasional Organisasi'}],cashOpening:[{accountId:'101',amount:10000000},{accountId:'102',amount:40000000}],transactions:[],seq:1};}
let memoryStore={};function storageGet(k){try{return localStorage.getItem(k)}catch(e){return memoryStore[k]??null}}function storageSet(k,v){try{localStorage.setItem(k,v)}catch(e){memoryStore[k]=String(v)}}function load(){try{const raw=storageGet(KEY);const x=raw?JSON.parse(raw):null;if(x&&x.accounts&&x.transactions&&x.activities)return x}catch(e){}return fresh()}
let db=load(), current='dashboard';let reportM=new Date().getMonth(),reportY=new Date().getFullYear();
function save(){storageSet(KEY,JSON.stringify(db))}
function rup(n){return 'Rp '+Math.round(Number(n)||0).toLocaleString('id-ID')}
function num(n){return Math.round(Number(n)||0).toLocaleString('id-ID')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function periodOf(date){let d=new Date(date+'T00:00:00');return {m:d.getMonth(),y:d.getFullYear()}}
function account(id){return db.accounts.find(a=>a.id===id)}
function cashAccounts(){return db.accounts.filter(a=>a.cash)}
function actName(id){return db.activities.find(a=>a.id===id)?.name||'-'}
function typeLabel(t){return {receipt:'Penerimaan',expense:'Pengeluaran',transfer:'Transfer Kas/Bank',asset:'Perolehan Aset',liability_in:'Penerimaan Kewajiban',liability_out:'Pembayaran Kewajiban'}[t]||t}
function txRows(){return db.transactions.map(t=>({...t,p:t.date?periodOf(t.date):{m:0,y:0}}))}
function journal(){let rows=[];for(const t of db.transactions){
 const a=t.amount; if(t.type==='receipt') rows.push({date:t.date,tx:t,id:t.id,debit:t.cashAccount,credit:t.account,amount:a});
 if(t.type==='expense') rows.push({date:t.date,tx:t,id:t.id,debit:t.account,credit:t.cashAccount,amount:a});
 if(t.type==='transfer'){rows.push({date:t.date,tx:t,id:t.id,debit:t.toCash,credit:t.cashAccount,amount:a});}
 if(t.type==='asset') rows.push({date:t.date,tx:t,id:t.id,debit:t.account,credit:t.cashAccount,amount:a});
 if(t.type==='liability_in') rows.push({date:t.date,tx:t,id:t.id,debit:t.cashAccount,credit:t.account,amount:a});
 if(t.type==='liability_out') rows.push({date:t.date,tx:t,id:t.id,debit:t.account,credit:t.cashAccount,amount:a});
}return rows}
function balances(){let b={};db.accounts.forEach(a=>b[a.id]=0);for(const x of journal()){b[x.debit]=(b[x.debit]||0)+x.amount;b[x.credit]=(b[x.credit]||0)-x.amount}for(const x of db.cashOpening||[]){b[x.accountId]=(b[x.accountId]||0)+Number(x.amount||0);b['301']=(b['301']||0)-Number(x.amount||0)}return b}
function opening(){let b={};for(const x of db.cashOpening)b[x.accountId]=(b[x.accountId]||0)+Number(x.amount||0);return b}
function cashBalance(){let b=balances();return cashAccounts().reduce((s,a)=>s+(b[a.id]||0),0)}
function totalsFor(m,y){let inc=0,out=0,n=0;for(const t of db.transactions){let p=periodOf(t.date);if(p.m===m&&p.y===y){n++;if(t.type==='receipt')inc+=t.amount;if(['expense','asset','liability_out'].includes(t.type))out+=t.amount}}return {inc,out,n,balance:inc-out}}
function nav(){let items=[['dashboard','🏠 Dashboard'],['transaksi','📝 Input Transaksi'],['laporan','📊 Neraca & Laporan Kas'],['kegiatan','📋 Laporan Kegiatan'],['cetak','🖨️ Cetak & PDF'],['pengaturan','⚙️ Pengaturan']];document.getElementById('nav').innerHTML=items.map(x=>`<button class="${current===x[0]?'active':''}" onclick="show('${x[0]}')">${x[1]}</button>`).join('')}
function show(id){current=id;nav();document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');render()}
function render(){if(current==='dashboard')renderDash();if(current==='transaksi')renderTx();if(current==='laporan')renderReports();if(current==='kegiatan')renderActivity();if(current==='cetak')renderPrintCenter();if(current==='pengaturan')renderSettings()}
function renderDash(){let now=new Date(),m=now.getMonth(),y=now.getFullYear(),t=totalsFor(m,y),bal=cashBalance();let byAct={};db.activities.forEach(a=>byAct[a.id]={in:0,out:0});db.transactions.forEach(x=>{let p=periodOf(x.date);if(p.m===m&&p.y===y&&byAct[x.activity]){if(x.type==='receipt')byAct[x.activity].in+=x.amount;if(x.type==='expense')byAct[x.activity].out+=x.amount}});document.getElementById('dashboard').innerHTML=`<div class="title-row"><div><h2>Dashboard</h2><div class="muted">Kondisi keuangan organisasi • ${months[m]} ${y}</div></div><button class="btn primary" onclick="show('transaksi')">+ Catat Transaksi</button></div>
<div class="grid cards"><div class="card metric"><div class="label">Saldo Kas & Bank</div><div class="value blue">${rup(bal)}</div></div><div class="card metric"><div class="label">Penerimaan Periode</div><div class="value green">${rup(t.inc)}</div></div><div class="card metric"><div class="label">Pengeluaran Periode</div><div class="value red">${rup(t.out)}</div></div><div class="card metric"><div class="label">Transaksi</div><div class="value">${t.n}</div></div></div>
<div class="grid two" style="margin-top:14px"><div class="card"><h3>Ringkasan Kegiatan</h3>${db.activities.map(a=>{let z=byAct[a.id]||{in:0,out:0};let mx=Math.max(z.in,z.out,1);return `<div style="margin:14px 0"><b>${esc(a.name)}</b><div class="small muted">Masuk ${rup(z.in)} • Keluar ${rup(z.out)}</div><div class="bar" style="margin-top:6px"><i style="width:${Math.min(100,Math.round(z.in/mx*100))}%"></i></div></div>`}).join('')}</div><div class="card"><h3>Posisi Singkat</h3><div class="grid two"><div><div class="muted small">Total Aset</div><b>${rup(totalGroup('Aset'))}</b></div><div><div class="muted small">Liabilitas</div><b>${rup(Math.abs(totalGroup('Liabilitas')))}</b></div><div><div class="muted small">Aset Neto</div><b>${rup(netAssets())}</b></div><div><div class="muted small">Selisih Periode</div><b class="${t.balance>=0?'green':'red'}">${rup(t.balance)}</b></div></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div class="notice"><strong>Mesin akuntansi aktif.</strong><br>Setiap transaksi otomatis membentuk pasangan debit-kredit untuk laporan.</div></div></div>`}
function totalGroup(g){let b=balances();return db.accounts.filter(a=>a.group===g).reduce((s,a)=>s+(b[a.id]||0),0)}
function netAssets(){return -(totalGroup('Aset Neto')+totalGroup('Penerimaan')+totalGroup('Beban'))}
function accountOptions(filter){return db.accounts.filter(a=>!filter||a.group===filter).map(a=>`<option value="${a.id}">${a.code} • ${esc(a.name)}</option>`).join('')}
function activityOptions(selected=''){return `<option value="">Tanpa kegiatan</option>`+db.activities.map(a=>`<option value="${a.id}" ${a.id===selected?'selected':''}>${esc(a.name)}</option>`).join('')}
function cashOptions(){return cashAccounts().map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}
function renderTx(){let editing=window.editTxId||'';let existing=db.transactions.find(t=>t.id===editing);let title=existing?'Edit Transaksi':'Input Transaksi';let saveLabel=existing?'Simpan Perubahan':'Simpan Transaksi';document.getElementById('transaksi').innerHTML=`<div class="title-row"><div><h2>${title}</h2><div class="muted">Satu transaksi → jurnal → laporan</div></div><div class="actions"><button class="btn secondary" onclick="loadDemo()">Muat Data Uji</button>${existing?'<button class="btn secondary" onclick="cancelEdit()">Batal Edit</button>':''}</div></div><div class="notice"><strong>Pencatatan organisasi nirlaba.</strong> Pilih jenis transaksi; sistem menentukan pasangan debit-kredit secara otomatis. Kegiatan dapat dikaitkan ke setiap transaksi. ${existing?'<b>Mode edit aktif:</b> perubahan akan menggantikan transaksi lama secara aman.':''}</div>
<div class="card"><form onsubmit="saveTx(event)"><div class="form-grid"><div class="field"><label>Tanggal</label><input id="txDate" type="date" value="${existing?.date||new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>Jenis Transaksi</label><select id="txType" onchange="refreshTxForm()"><option value="receipt" ${existing?.type==='receipt'?'selected':''}>Penerimaan</option><option value="expense" ${existing?.type==='expense'?'selected':''}>Pengeluaran</option><option value="transfer" ${existing?.type==='transfer'?'selected':''}>Transfer Kas/Bank</option><option value="asset" ${existing?.type==='asset'?'selected':''}>Perolehan Aset</option><option value="liability_in" ${existing?.type==='liability_in'?'selected':''}>Penerimaan Kewajiban</option><option value="liability_out" ${existing?.type==='liability_out'?'selected':''}>Pembayaran Kewajiban</option></select></div><div id="dynamicTx" class="full"></div><div class="field"><label>Kegiatan</label><select id="txActivity">${activityOptions(existing?.activity||'')}</select></div><div class="field"><label>Nomor Bukti</label><input id="txProof" value="${esc(existing?.proof||'')}" placeholder="BK-2026-001"></div><div class="field"><label>Nominal</label><input id="txAmount" type="number" min="1" step="1" value="${existing?.amount||''}" placeholder="0" required></div><div class="field"><label>Keterangan</label><input id="txDesc" value="${esc(existing?.description||'')}" placeholder="Uraian transaksi" required></div><div class="field full"><label>Bukti / referensi</label><input id="txEvidence" value="${esc(existing?.evidence||'')}" placeholder="Nama file, nomor kuitansi, atau catatan referensi"></div></div><div class="actions"><button class="btn primary">${saveLabel}</button><button type="reset" class="btn secondary" onclick="setTimeout(refreshTxForm,0)">Bersihkan</button></div></form></div><div class="card" style="margin-top:14px"><div class="title-row"><div><h3 style="margin:0">Daftar Transaksi</h3><div class="subtle">Gunakan Edit jika ada kesalahan input. Hapus hanya jika transaksi memang harus dibatalkan.</div></div></div><div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Jenis</th><th>Akun</th><th>Kegiatan</th><th>Keterangan</th><th class="num">Nominal</th><th>Aksi</th></tr></thead><tbody>${db.transactions.length?db.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<tr><td class="nowrap">${t.date}</td><td>${typeLabel(t.type)}</td><td>${esc(account(t.account)?.name||'-')}</td><td>${esc(actName(t.activity))}</td><td>${esc(t.description)}</td><td class="num">${num(t.amount)}</td><td class="actions"><button class="btn secondary" onclick="editTx('${t.id}')">✏️ Edit</button><button class="btn danger" onclick="delTx('${t.id}')">🗑️ Hapus</button></td></tr>`).join(''):`<tr><td colspan="7" class="empty">Belum ada transaksi.</td></tr>`}</tbody></table></div></div>`;refreshTxForm();if(existing){setTimeout(()=>fillEditDynamic(existing),0)} }
function fillEditDynamic(t){refreshTxForm();let acc=document.getElementById('txAccount'),cash=document.getElementById('txCash'),to=document.getElementById('txToCash');if(acc&&t.account)acc.value=t.account;if(cash&&t.cashAccount)cash.value=t.cashAccount;if(to&&t.toCash)to.value=t.toCash}
function editTx(id){window.editTxId=id;show('transaksi')}
function cancelEdit(){window.editTxId='';show('transaksi')}
function saveTx(e){e.preventDefault();let type=txType.value,amount=Number(txAmount.value||0);if(amount<=0)return alert('Nominal harus lebih dari 0.');let t={id:window.editTxId||'TX'+Date.now(),date:txDate.value,type,account:document.getElementById('txAccount')?.value||'',cashAccount:document.getElementById('txCash')?.value||'',toCash:document.getElementById('txToCash')?.value||'',activity:txActivity.value,proof:txProof.value.trim(),evidence:txEvidence.value.trim(),amount,description:txDesc.value.trim()};if(!t.date)return alert('Tanggal wajib diisi.');if(!t.description)return alert('Keterangan wajib diisi.');if(type==='transfer'&&t.cashAccount===t.toCash)return alert('Kas/Bank sumber dan tujuan harus berbeda.');if(window.editTxId){let i=db.transactions.findIndex(x=>x.id===window.editTxId);if(i<0)return alert('Transaksi yang diedit tidak ditemukan.');db.transactions[i]=t}else db.transactions.push(t);const wasEdit=!!window.editTxId;save();window.editTxId='';show('transaksi');alert(wasEdit?'Perubahan transaksi disimpan.':'Transaksi berhasil disimpan.')}
function refreshTxForm(){let type=document.getElementById('txType')?.value||'receipt',d=document.getElementById('dynamicTx');if(!d)return;let html='';if(type==='receipt')html=`<div class="form-grid"><div class="field"><label>Akun Penerimaan</label><select id="txAccount">${accountOptions('Penerimaan')}</select></div><div class="field"><label>Kas/Bank Tujuan</label><select id="txCash">${cashOptions()}</select></div></div>`;if(type==='expense')html=`<div class="form-grid"><div class="field"><label>Akun Beban</label><select id="txAccount">${accountOptions('Beban')}</select></div><div class="field"><label>Kas/Bank Sumber</label><select id="txCash">${cashOptions()}</select></div></div>`;if(type==='transfer')html=`<div class="form-grid"><div class="field"><label>Kas/Bank Sumber</label><select id="txCash">${cashOptions()}</select></div><div class="field"><label>Kas/Bank Tujuan</label><select id="txToCash">${cashOptions()}</select></div></div>`;if(type==='asset')html=`<div class="form-grid"><div class="field"><label>Aset</label><select id="txAccount">${accountOptions('Aset').replace(/<option value="10[1-3]"[^>]*>.*?<\/option>/g,'')}</select></div><div class="field"><label>Kas/Bank Sumber</label><select id="txCash">${cashOptions()}</select></div></div>`;if(type==='liability_in')html=`<div class="form-grid"><div class="field"><label>Kewajiban</label><select id="txAccount">${accountOptions('Liabilitas')}</select></div><div class="field"><label>Kas/Bank Tujuan</label><select id="txCash">${cashOptions()}</select></div></div>`;if(type==='liability_out')html=`<div class="form-grid"><div class="field"><label>Kewajiban</label><select id="txAccount">${accountOptions('Liabilitas')}</select></div><div class="field"><label>Kas/Bank Sumber</label><select id="txCash">${cashOptions()}</select></div></div>`;d.innerHTML=html}
function addTx(e){e.preventDefault();let type=txType.value,amount=Number(txAmount.value||0);if(amount<=0)return alert('Nominal harus lebih dari 0.');let t={id:'TX'+Date.now(),date:txDate.value,type,account:document.getElementById('txAccount')?.value||'',cashAccount:document.getElementById('txCash')?.value||'',toCash:document.getElementById('txToCash')?.value||'',activity:txActivity.value,proof:txProof.value,evidence:txEvidence.value,amount,description:txDesc.value};if(type==='transfer'&&t.cashAccount===t.toCash)return alert('Kas/Bank sumber dan tujuan harus berbeda.');db.transactions.push(t);save();renderTx();alert('Transaksi tersimpan dan jurnal otomatis terbentuk.')}

function setReportPeriod(){reportM=Number(document.getElementById('reportMonth')?.value??reportM);reportY=Number(document.getElementById('reportYear')?.value??reportY);renderReports()}
function renderReports(){let m=reportM,y=reportY,t=totalsFor(m,y),b=balances();let assets=db.accounts.filter(a=>a.group==='Aset'),liab=db.accounts.filter(a=>a.group==='Liabilitas'),nets=db.accounts.filter(a=>a.group==='Aset Neto');let rows=(arr,sign=1)=>arr.map(a=>`<tr><td>${a.code}</td><td>${esc(a.name)}</td><td class="num">${num((b[a.id]||0)*sign)}</td></tr>`).join('');let begin=cashBeginning(m,y),end=begin+t.balance;let totalAssets=totalGroup('Aset'),totalLiab=Math.abs(totalGroup('Liabilitas')),totalNet=netAssets(),check=totalAssets-(totalLiab+totalNet);document.getElementById('laporan').innerHTML=`<div class="title-row"><div><h2>Neraca & Laporan Kas</h2><div class="muted">${months[m]} ${y}</div></div><div class="actions no-print"><button class="btn secondary" onclick="preparePrint('financial')">🖨️ Cetak / PDF</button><button class="btn secondary" onclick="show('cetak')">📄 Pusat Laporan</button></div></div><div class="card no-print" style="margin-bottom:14px"><div class="form-grid"><div class="field"><label>Periode Laporan — Bulan</label><select id="reportMonth" onchange="setReportPeriod()">${months.map((x,i)=>`<option value="${i}" ${i===m?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Tahun</label><input id="reportYear" type="number" min="2000" max="2100" value="${y}" onchange="setReportPeriod()"></div></div></div><div class="grid cards no-print"><div class="card metric"><div class="label">Kas & Bank</div><div class="value blue">${rup(cashBalance())}</div></div><div class="card metric"><div class="label">Penerimaan</div><div class="value green">${rup(t.inc)}</div></div><div class="card metric"><div class="label">Pengeluaran</div><div class="value red">${rup(t.out)}</div></div><div class="card metric"><div class="label">Selisih Kas Periode</div><div class="value ${t.balance>=0?'green':'red'}">${rup(t.balance)}</div></div></div><div class="grid two" style="margin-top:14px"><div class="card"><h3>Laporan Posisi Keuangan</h3><div class="table-wrap"><table><thead><tr><th>Kode</th><th>Pos</th><th class="num">Saldo</th></tr></thead><tbody>${rows(assets,1)}<tr><th colspan="2">Total Aset</th><th class="num">${num(totalAssets)}</th></tr>${rows(liab,-1)}<tr><th colspan="2">Total Liabilitas</th><th class="num">${num(totalLiab)}</th></tr>${rows(nets,-1)}<tr><th colspan="2">Aset Neto</th><th class="num">${num(totalNet)}</th></tr><tr><th colspan="2">Total Liabilitas + Aset Neto</th><th class="num">${num(totalLiab+totalNet)}</th></tr><tr><th colspan="2">Status Keseimbangan</th><th class="num ${check===0?'green':'red'}">${check===0?'SEIMBANG':'SELISIH '+num(check)}</th></tr></tbody></table></div></div><div class="card"><h3>Laporan Aktivitas & Kas</h3><table><tbody><tr><td>Saldo kas awal</td><td class="num">${num(begin)}</td></tr><tr><td>Total penerimaan</td><td class="num green">${num(t.inc)}</td></tr><tr><td>Total pengeluaran</td><td class="num red">${num(t.out)}</td></tr><tr><th>Surplus/(Defisit) Periode</th><th class="num ${t.balance>=0?'green':'red'}">${num(t.balance)}</th></tr><tr><th>Kenaikan/(penurunan) kas</th><th class="num">${num(t.balance)}</th></tr><tr><th>Saldo kas akhir</th><th class="num">${num(end)}</th></tr></tbody></table><h4 style="margin-top:18px">Rincian Penerimaan</h4>${reportByAccount('receipt',m,y)}<h4>Rincian Pengeluaran</h4>${reportByAccount('expense',m,y)}</div></div><div class="notice no-print" style="margin-top:14px"><strong>Catatan:</strong> laporan menggunakan istilah organisasi berorientasi nonlaba. Tidak menggunakan istilah “Laba Rugi”.</div>`}
function cashBeginning(m,y){let o=Object.values(opening()).reduce((a,b)=>a+b,0);return o+db.transactions.filter(t=>{let p=periodOf(t.date);return p.y<y||(p.y===y&&p.m<m)}).reduce((s,t)=>s+(t.type==='receipt'?t.amount:['expense','asset','liability_out'].includes(t.type)?-t.amount:0),0)}
function reportByAccount(type,m,y){let map={};db.transactions.forEach(t=>{let p=periodOf(t.date);if(p.m===m&&p.y===y&&t.type===type)map[t.account]=(map[t.account]||0)+t.amount});return `<table><tbody>${Object.entries(map).map(([id,v])=>`<tr><td>${esc(account(id)?.name||'-')}</td><td class="num">${num(v)}</td></tr>`).join('')||'<tr><td class="muted">Tidak ada</td><td></td></tr>'}</tbody></table>`}
function renderPrintCenter(){let m=reportM,y=reportY;document.getElementById('cetak').innerHTML=`<div class="title-row"><div><h2>Pusat Cetak & PDF</h2><div class="muted">Laporan formal siap dicetak atau disimpan sebagai PDF melalui dialog cetak perangkat.</div></div></div><div class="grid two"><div class="card"><h3>Laporan Keuangan</h3><p class="muted">Format formal: laporan posisi keuangan, laporan kas & aktivitas, serta ringkasan penerimaan/pengeluaran.</p><div class="actions"><button class="btn primary" onclick="preparePrint('financial')">🖨️ Cetak / Simpan PDF</button></div></div><div class="card"><h3>Laporan Kegiatan</h3><p class="muted">Pilih kegiatan lalu cetak laporan masuk/keluar dan detail transaksinya.</p><div class="actions"><button class="btn primary" onclick="preparePrint('activity')">🖨️ Cetak / Simpan PDF</button></div></div></div><div class="card" style="margin-top:14px"><h3>Petunjuk PDF</h3><ol><li>Tekan tombol Cetak / Simpan PDF.</li><li>Pada dialog cetak Chrome, pilih <b>Simpan sebagai PDF</b> jika ingin file PDF.</li><li>Untuk cetak kertas, pilih printer yang tersedia.</li></ol><div class="notice">Laporan dicetak dengan format formal A4, judul organisasi, periode, tabel, total, dan area tanda tangan.</div></div>`}
function preparePrint(kind){if(kind==='financial')buildFinancialPrint();else buildActivityPrint();setTimeout(()=>window.print(),100)}
function printHead(title,period){return `<div class="print-head"><h1>${esc(db.org||'Organisasi Saya')}</h1><h2>${title}</h2><p>Periode ${period}</p></div>`}
function buildFinancialPrint(){let m=reportM,y=reportY,t=totalsFor(m,y),b=balances(),assets=db.accounts.filter(a=>a.group==='Aset'),liab=db.accounts.filter(a=>a.group==='Liabilitas'),nets=db.accounts.filter(a=>a.group==='Aset Neto'),totalAssets=totalGroup('Aset'),totalLiab=Math.abs(totalGroup('Liabilitas')),totalNet=netAssets(),begin=cashBeginning(m,y),end=begin+t.balance;let assetRows=assets.map(a=>`<tr><td>${a.code}</td><td>${esc(a.name)}</td><td class="num">${num(b[a.id]||0)}</td></tr>`).join('');let liabRows=liab.map(a=>`<tr><td>${a.code}</td><td>${esc(a.name)}</td><td class="num">${num(Math.abs(b[a.id]||0))}</td></tr>`).join('');document.getElementById('printArea').innerHTML=`${printHead('Laporan Posisi Keuangan',months[m]+' '+y)}<div class="print-section"><table><thead><tr><th>Kode</th><th>Pos</th><th class="num">Saldo</th></tr></thead><tbody>${assetRows}<tr class="total"><th colspan="2">TOTAL ASET</th><th class="num">${num(totalAssets)}</th></tr>${liabRows}<tr class="total"><th colspan="2">TOTAL LIABILITAS</th><th class="num">${num(totalLiab)}</th></tr><tr><td colspan="2">Aset Neto</td><td class="num">${num(totalNet)}</td></tr><tr class="grand"><th colspan="2">TOTAL LIABILITAS + ASET NETO</th><th class="num">${num(totalLiab+totalNet)}</th></tr></tbody></table></div><div class="print-section"><h3>Laporan Aktivitas & Kas</h3><table><tbody><tr><td>Saldo kas awal</td><td class="num">${num(begin)}</td></tr><tr><td>Total penerimaan</td><td class="num">${num(t.inc)}</td></tr><tr><td>Total pengeluaran</td><td class="num">${num(t.out)}</td></tr><tr class="total"><th>Surplus/(Defisit) Periode</th><th class="num">${num(t.balance)}</th></tr><tr class="total"><th>Kenaikan/(penurunan) kas</th><th class="num">${num(t.balance)}</th></tr><tr class="grand"><th>Saldo kas akhir</th><th class="num">${num(end)}</th></tr></tbody></table></div><div class="print-section"><h3>Ringkasan Penerimaan dan Pengeluaran</h3><table><thead><tr><th>Jenis</th><th class="num">Jumlah</th></tr></thead><tbody>${reportByAccountRows('receipt',m,y)}${reportByAccountRows('expense',m,y)}</tbody></table></div><div class="signature"><div class="signature-box">${esc(db.org||'Organisasi Saya')}<br><br><br><b>________________________</b><br>Penanggung Jawab Keuangan</div></div><div class="footer">Dicetak dari SKO • Sistem Keuangan Organisasi • ${new Date().toLocaleString('id-ID')}</div>`}
function reportByAccountRows(type,m,y){let map={};db.transactions.forEach(t=>{let p=periodOf(t.date);if(p.m===m&&p.y===y&&t.type===type)map[t.account]=(map[t.account]||0)+t.amount});return Object.entries(map).map(([id,v])=>`<tr><td>${type==='receipt'?'Penerimaan':'Pengeluaran'} — ${esc(account(id)?.name||'-')}</td><td class="num">${num(v)}</td></tr>`).join('')||`<tr><td>${type==='receipt'?'Tidak ada penerimaan':'Tidak ada pengeluaran'}</td><td class="num">0</td></tr>`}
function buildActivityPrint(){let id=document.getElementById('activityFilter')?.value||db.activities[0]?.id, name=actName(id),ts=db.transactions.filter(t=>t.activity===id).sort((a,b)=>a.date.localeCompare(b.date)),inn=ts.filter(t=>t.type==='receipt').reduce((s,t)=>s+t.amount,0),out=ts.filter(t=>['expense','asset','liability_out'].includes(t.type)).reduce((s,t)=>s+t.amount,0);document.getElementById('printArea').innerHTML=`${printHead('Laporan Kegiatan — '+name,'Semua transaksi tercatat')}<div class="print-section"><table><thead><tr><th>Tanggal</th><th>No. Bukti</th><th>Keterangan</th><th class="num">Masuk</th><th class="num">Keluar</th></tr></thead><tbody>${ts.map(t=>`<tr><td>${t.date}</td><td>${esc(t.proof||'-')}</td><td>${esc(t.description)}</td><td class="num">${t.type==='receipt'?num(t.amount):'-'}</td><td class="num">${['expense','asset','liability_out'].includes(t.type)?num(t.amount):'-'}</td></tr>`).join('')||'<tr><td colspan="5">Tidak ada transaksi.</td></tr>'}<tr class="total"><th colspan="3">TOTAL</th><th class="num">${num(inn)}</th><th class="num">${num(out)}</th></tr><tr class="grand"><th colspan="3">SELISIH KEGIATAN</th><th colspan="2" class="num">${num(inn-out)}</th></tr></tbody></table></div><div class="signature"><div class="signature-box">${esc(db.org||'Organisasi Saya')}<br><br><br><b>________________________</b><br>Penanggung Jawab Kegiatan</div></div><div class="footer">Dicetak dari SKO • ${new Date().toLocaleString('id-ID')}</div>`}
function renderActivity(){let html=`<div class="title-row"><div><h2>Laporan Kegiatan</h2><div class="muted">Arus masuk dan keluar per kegiatan</div></div></div><div class="card"><div class="field"><label>Pilih kegiatan</label><select id="activityFilter" onchange="renderActivityTable()">${db.activities.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div></div><div id="activityTable" style="margin-top:14px"></div>`;document.getElementById('kegiatan').innerHTML=html;renderActivityTable()}
function renderActivityTable(){let id=document.getElementById('activityFilter')?.value||db.activities[0]?.id, ts=db.transactions.filter(t=>t.activity===id).sort((a,b)=>a.date.localeCompare(b.date));let inn=ts.filter(t=>t.type==='receipt').reduce((s,t)=>s+t.amount,0),out=ts.filter(t=>['expense','asset','liability_out'].includes(t.type)).reduce((s,t)=>s+t.amount,0);document.getElementById('activityTable').innerHTML=`<div class="grid cards"><div class="card metric"><div class="label">Total Masuk</div><div class="value green">${rup(inn)}</div></div><div class="card metric"><div class="label">Total Keluar</div><div class="value red">${rup(out)}</div></div><div class="card metric"><div class="label">Selisih Kegiatan</div><div class="value ${inn-out>=0?'green':'red'}">${rup(inn-out)}</div></div><div class="card metric"><div class="label">Transaksi</div><div class="value">${ts.length}</div></div></div><div class="card" style="margin-top:14px"><h3>Detail Transaksi • ${esc(actName(id))}</h3><div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>No Bukti</th><th>Keterangan</th><th class="num">Masuk</th><th class="num">Keluar</th></tr></thead><tbody>${ts.map(t=>`<tr><td>${t.date}</td><td>${esc(t.proof||'-')}</td><td>${esc(t.description)}</td><td class="num green">${t.type==='receipt'?num(t.amount):'-'}</td><td class="num red">${['expense','asset','liability_out'].includes(t.type)?num(t.amount):'-'}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Belum ada transaksi untuk kegiatan ini.</td></tr>'}</tbody></table></div></div>`}
function renderSettings(){document.getElementById('pengaturan').innerHTML=`<div class="title-row"><div><h2>Pengaturan</h2><div class="muted">Master data, backup dan data uji</div></div></div><div class="grid two"><div class="card"><h3>Organisasi</h3><div class="field"><label>Nama organisasi</label><input id="orgName" value="${esc(db.org)}"><button class="btn primary" onclick="db.org=document.getElementById('orgName').value;save();alert('Disimpan')">Simpan</button></div></div><div class="card"><h3>Data</h3><div class="actions"><button class="btn secondary" onclick="backup()">Backup JSON</button><button class="btn secondary" onclick="document.getElementById('restoreFile').click()">Restore</button><input id="restoreFile" type="file" accept="application/json" style="display:none" onchange="restore(event)"><button class="btn success" onclick="loadDemo()">Muat Data Uji</button><button class="btn danger" onclick="resetAll()">Reset</button></div></div></div><div class="grid two" style="margin-top:14px"><div class="card"><h3>Master Kegiatan</h3><div class="actions"><input id="newAct" placeholder="Nama kegiatan"><button class="btn primary" onclick="addActivity()">Tambah</button></div><ul>${db.activities.map(a=>`<li style="margin:9px 0">${esc(a.name)}</li>`).join('')}</ul></div><div class="card"><h3>Chart of Accounts</h3><div class="table-wrap"><table><thead><tr><th>Kode</th><th>Akun</th><th>Kelompok</th></tr></thead><tbody>${db.accounts.map(a=>`<tr><td>${a.code}</td><td>${esc(a.name)}</td><td>${a.group}</td></tr>`).join('')}</tbody></table></div></div></div>`}
function addActivity(){let v=document.getElementById('newAct').value.trim();if(!v)return;db.activities.push({id:'ACT'+Date.now(),name:v});save();renderSettings()}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='SKO_MVP1_BACKUP.json';a.click();URL.revokeObjectURL(a.href)}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.accounts||!x.transactions||!x.activities)throw Error();db=x;save();render();alert('Restore berhasil')}catch(err){alert('File backup tidak valid')}};r.readAsText(f)}
function resetAll(){if(confirm('Reset seluruh data lokal?')){db=fresh();save();render()}}

{id:'D3',date:`${y}-${m}-05`,type:'expense',account:'501',cashAccount:'102',activity:'ACT1',proof:'KK-001',amount:5000000,description:'Sewa tempat pelatihan'},
{id:'D4',date:`${y}-${m}-06`,type:'expense',account:'501',cashAccount:'102',activity:'ACT1',proof:'KK-002',amount:3000000,description:'Konsumsi pelatihan'},
{id:'D5',date:`${y}-${m}-07`,type:'expense',account:'503',cashAccount:'103',activity:'ACT3',proof:'KK-003',amount:1500000,description:'ATK dan administrasi'},
{id:'D6',date:`${y}-${m}-08`,type:'asset',account:'121',cashAccount:'103',activity:'ACT3',proof:'KK-004',amount:4000000,description:'Pembelian peralatan'}];save();show('dashboard')}
nav();render();
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});

<script>
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  const b = document.getElementById('pwaInstallBtn');
  if (b) b.style.display = 'inline-flex';
});
async function installSKO(){
  if(!deferredInstallPrompt){
    alert('Untuk memasang SKO: buka aplikasi melalui Chrome dari alamat HTTPS, lalu pilih menu Chrome → Tambahkan ke layar utama / Install app.');
    return;
  }
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  const b = document.getElementById('pwaInstallBtn');
  if (b) b.style.display = 'none';
}
</script>
